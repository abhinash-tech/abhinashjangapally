<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="container">
    <p id="browser-note" style="display:none;font-size:12px;color:#777;margin-bottom:12px;">
  Tap ⋮ and choose <b>Open in Browser</b> for best experience 🌐
    </p>
   <div class="toggle-wrapper">
  <div class="theme-text" id="themeText">Light</div>

  <div class="theme-switch" onclick="toggleTheme()">
    <div class="switch">
      <div class="knob"></div>
      <div class="bubble b1"></div>
      <div class="bubble b2"></div>
    </div>
  </div>
</div>
    <img src="Billa-2009(Prabhas).jpeg" alt="Abhinash" class="profile-img"/>

    <h1>Abhinash Jangapally</h1>
    <p class="bio">𝘓𝘦𝘢𝘳𝘯 𝘣𝘺 𝘣𝘶𝘪𝘭𝘥𝘪𝘯𝘨 :)</p>

    <div class="links">
      <a href="https://www.instagram.com/abhinash.stark" target="_blank">
        <i class="fab fa-instagram"></i> Instagram
      </a>

      <a href="https://abhinash-tech.github.io/portfolio/" target="_blank">
        <i class="fab fa-globe"></i> Portfolio
      </a>

      <a href="https://www.linkedin.com/in/abhinashjangapally40" target="_blank">
        <i class="fab fa-linkedin"></i> LinkedIn
      </a>

      <a href="https://github.com/abhinash-tech" target="_blank">
        <i class="fab fa-github"></i> GitHub
      </a>

      <a href="https://twitter.com/abhinash40" target="_blank">
        <i class="fab fa-x-twitter"></i> X (Twitter)
      </a>
    </div>
  </div>
<script>
  const themeText = document.getElementById("themeText");

  function applyTheme(isDark) {
    document.body.classList.toggle("dark", isDark);
    themeText.textContent = isDark ? "Dark" : "Light";
  }

  // Detect system theme on load
  const systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
  applyTheme(systemDark);

  function toggleTheme() {
    const isDark = !document.body.classList.contains("dark");
    applyTheme(isDark);
  }
</script>
  <script>
  const ua = navigator.userAgent || navigator.vendor || window.opera;

  if (ua.includes("Instagram") && !ua.includes("Android")) {
    document.getElementById("browser-note").style.display = "block";
  }
  </script>
  <script>
  (function () {
    const ua = navigator.userAgent || navigator.vendor || window.opera;

    const isInstagram = ua.includes("Instagram");
    const isAndroid = ua.includes("Android");

    if (isInstagram && isAndroid) {
      const currentUrl = window.location.href
        .replace(/^https?:\/\//, "");

      // Redirect to Chrome using intent
      window.location.href =
        "intent://" +
        currentUrl +
        "#Intent;scheme=https;package=com.android.chrome;end;";
    }
  })();
  </script>
</body>
          </html>
